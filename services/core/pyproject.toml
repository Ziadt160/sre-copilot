[project]
name = "sre-core"
version = "0.1.0"
description = "SRE Copilot core service: auth, chat API, agent graph and hybrid retrieval."
requires-python = ">=3.12,<3.13"
dependencies = [
    "sre-shared",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "pyjwt[crypto]>=2.9",  # ES256/RS256 Supabase access tokens (api/auth.py)
    # Phase 3 agent (versions checked on PyPI 2026-11-02)
    "langgraph==1.2.19",
    "langgraph-checkpoint-postgres==3.2.0",
    "fastmcp==4.1.5",  # the client the action route uses to call mcp-ops (no langchain adapter: mcp<2)
    "redis>=8.0,<8.1",
    "langsmith>=0.2",  # review: tracing, feedback sync, label mirror (T16)
]

[project.scripts]
sre-core = "sre_core.api.main:run"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
