[project]
name = "sre-core"
version = "0.1.0"
description = "SRE Copilot core service: auth, chat API, agent graph and hybrid retrieval."
requires-python = ">=3.12,<3.13"
dependencies = [
    "sre-shared",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "pyjwt>=2.9",
]

[project.scripts]
sre-core = "sre_core.api.main:run"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
