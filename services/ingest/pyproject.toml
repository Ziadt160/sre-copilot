[project]
name = "sre-ingest"
version = "0.1.0"
description = "Ingests versioned Kubernetes docs: fetch, parse, chunk, embed, upsert, activate."
requires-python = ">=3.12,<3.13"
dependencies = [
    "sre-shared",
    "typer>=0.12",
    "rich>=13.9",
    "markdown-it-py>=3.0",
    "pyarrow>=18.0",
]

[project.scripts]
sre-ingest = "sre_ingest.cli:app"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
