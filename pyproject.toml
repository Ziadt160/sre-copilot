[project]
name = "sre-copilot"
version = "0.1.0"
description = "SRE copilot: hybrid RAG over versioned Kubernetes docs, with an MCP agent for cluster actions."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "sre-shared",
    "sre-core",
    "sre-ingest",
    "sre-evals",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "pytest-timeout>=2.3",
    "testcontainers>=4.9",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.1",
    "pre-commit>=4.0",
    "types-PyYAML",
    "locust>=2.32",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/shared", "services/core", "services/ingest", "evals"]

[tool.uv.sources]
sre-shared = { workspace = true }
sre-core = { workspace = true }
sre-ingest = { workspace = true }
sre-evals = { workspace = true }

# --- lint / format ---------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".orchestra", "supabase", "web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S"]
ignore = [
    "S101",  # assert is fine in tests and invariants
    "S608",  # SQL is built from whitelisted identifiers only; see sre_core.retrieval
]

[tool.ruff.lint.pycodestyle]
max-line-length = 120  # format wraps code at 100; long strings and URLs may run to 120

[tool.ruff.lint.isort]
known-first-party = ["sre_shared", "sre_core", "sre_ingest", "sre_evals"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "B"]

# --- types -------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = ["packages/shared/src", "services/core/src", "services/ingest/src", "evals/src"]
files = ["packages/shared/src", "services/core/src", "services/ingest/src", "evals/src"]
explicit_package_bases = true
exclude = ["/tests/", "^\\.orchestra/"]

[[tool.mypy.overrides]]
module = [
    "testcontainers.*",
    "onnxruntime.*",
    "pgvector.*",
    "deepeval.*",
    "pyarrow.*",
    "frontmatter.*",
    "docker.*",
]
ignore_missing_imports = true

# --- tests -------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.3"
testpaths = ["packages/shared/tests", "services/core/tests", "services/ingest/tests", "evals/tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
timeout = 300
markers = [
    "integration: needs Docker (a disposable supabase/postgres container) or SRE_TEST_DATABASE_URL",
    "gpu: needs the lab GPU embedding server (tools/gpu_embed_server.py) on SRE gpu_embed_url",
    "lab: needs the local Supabase stack (npx supabase start) and lab services",
    "models: downloads or loads real embedding models",
]

# --- module boundaries ------------------------------------------------------
[tool.importlinter]
root_packages = ["sre_shared", "sre_core", "sre_ingest", "sre_evals"]

[[tool.importlinter.contracts]]
name = "shared depends on no other first-party package"
type = "forbidden"
source_modules = ["sre_shared"]
forbidden_modules = ["sre_core", "sre_ingest", "sre_evals"]

[[tool.importlinter.contracts]]
name = "core does not import ingest or evals"
type = "forbidden"
source_modules = ["sre_core"]
forbidden_modules = ["sre_ingest", "sre_evals"]

[[tool.importlinter.contracts]]
name = "ingest does not import core or evals"
type = "forbidden"
source_modules = ["sre_ingest"]
forbidden_modules = ["sre_core", "sre_evals"]

[[tool.importlinter.contracts]]
name = "core layers: api, agent, answer, retrieval"
type = "layers"
layers = ["sre_core.api", "sre_core.agent", "sre_core.answer", "sre_core.retrieval"]
containers = []
exhaustive = false
