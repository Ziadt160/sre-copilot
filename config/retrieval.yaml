# Default retrieval knobs. Every value here is to be set by an experiment on the golden set
# (config/experiments/), not left at its default; the eval run stamps record which config ran.
mode: dense                       # dense | hybrid | keyword (GET /search default). Decision 29:
                                  # hybrid did not beat dense on golden v1 at any fusion setting
embedding_model: gte-small        # gte-small | bge-large | bge-m3 (lab only for the BGE models)
ts_config: english                # english | simple
keyword_match: any                # any | all query terms (all: websearch_to_tsquery)
candidates_per_leg: 50
k: 5
rrf_k: 60
weights:
  dense: 1.0
  keyword: 1.0
hnsw:
  ef_search: 100                  # must be >= candidates_per_leg unless iterative scan is on
  iterative_scan: relaxed_order   # off | relaxed_order | strict_order
  max_scan_tuples: 20000
router:                           # used when a request sets route_by_query_type (Phase 2 experiment)
  literal:                        # the query has an error name, multi-word flag or field path
    use_dense: true
    use_keyword: true
    w_dense: 1.0
    w_keyword: 0.5                # best exact-string recall@5 in the Phase 1 fusion sweep
    rrf_k: 10
  default:                        # everything else: dense only (decision 29)
    use_dense: true
    use_keyword: false
