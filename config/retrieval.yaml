# Default retrieval knobs. Every value here is to be set by an experiment on the golden set
# (config/experiments/), not left at its default; the eval run stamps record which config ran.
embedding_model: gte-small        # gte-small | bge-large | bge-m3 (lab only for the BGE models)
ts_config: english                # english | simple
candidates_per_leg: 50
k: 5
rrf_k: 60
weights:
  dense: 1.0
  keyword: 1.0
hnsw:
  ef_search: 100                  # must be >= candidates_per_leg unless iterative scan is on
  iterative_scan: relaxed_order   # off | relaxed_order | strict_order
  max_scan_tuples: 20000
