name: kw-english-all
description: "Keyword leg only, english, every query term must match (websearch_to_tsquery); the pre-fix behaviour, kept to measure the any-term default."
embedding_model: gte-small
legs: [keyword]
ts_config: english
keyword_match: all
weights: {dense: 1.0, keyword: 1.0}
k: [3, 5, 8, 10]
candidates_per_leg: 50
rrf_k: 60
ef_search: 100
iterative_scan: relaxed_order
