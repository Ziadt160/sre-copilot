name: dense-gte-small-chunk-o64
description: "Dense gte-small on the chunking variant o64: 64-token overlap within sections; packing at 446 tokens to leave room (two changes at once). Corpus label from sre-ingest run --chunking o64."
embedding_model: gte-small
legs: [dense]
ts_config: english
weights: {dense: 1.0, keyword: 1.0}
k: [3, 5, 8, 10]
candidates_per_leg: 50
rrf_k: 60
ef_search: 100
iterative_scan: relaxed_order
corpus_version: k8s-1.37+1.36+1.35-chunker1-o64
