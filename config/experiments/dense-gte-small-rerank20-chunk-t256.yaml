name: dense-gte-small-rerank20-chunk-t256
description: "Dense gte-small + bge-reranker-base top 20 on the chunking variant t256: 256-token chunks (default 510). Corpus label from sre-ingest run --chunking t256."
embedding_model: gte-small
legs: [dense]
ts_config: english
weights: {dense: 1.0, keyword: 1.0}
k: [3, 5, 8, 10]
candidates_per_leg: 50
rrf_k: 60
ef_search: 100
iterative_scan: relaxed_order
corpus_version: k8s-1.37+1.36+1.35-chunker1-t256
rerank:
  model: BAAI/bge-reranker-base
  candidates: 20
