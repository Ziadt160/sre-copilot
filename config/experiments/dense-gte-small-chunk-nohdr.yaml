name: dense-gte-small-chunk-nohdr
description: "Dense gte-small on the chunking variant nohdr: chunk header left out of the embedded text (still in the keyword index). Corpus label from sre-ingest run --chunking nohdr."
embedding_model: gte-small
legs: [dense]
ts_config: english
weights: {dense: 1.0, keyword: 1.0}
k: [3, 5, 8, 10]
candidates_per_leg: 50
rrf_k: 60
ef_search: 100
iterative_scan: relaxed_order
corpus_version: k8s-1.37+1.36+1.35-chunker1-nohdr
