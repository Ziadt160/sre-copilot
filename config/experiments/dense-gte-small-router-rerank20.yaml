name: dense-gte-small-router-rerank20
description: "Query-type router (literal queries add the keyword leg, w 0.5, rrf_k 10), then the top 20 fused candidates reranked by bge-reranker-base."
embedding_model: gte-small
legs: [dense]
ts_config: english
weights: {dense: 1.0, keyword: 1.0}
k: [3, 5, 8, 10]
candidates_per_leg: 50
rrf_k: 60
ef_search: 100
iterative_scan: relaxed_order
route_by_query_type: true
rerank:
  model: BAAI/bge-reranker-base
  candidates: 20
