name: dense-gte-small-router
description: "Dense gte-small with the query-type router: literal queries use the router.literal route, others router.default (config/retrieval.yaml)."
embedding_model: gte-small
legs: [dense]
ts_config: english
weights: {dense: 1.0, keyword: 1.0}
k: [3, 5, 8, 10]
candidates_per_leg: 50
rrf_k: 60
ef_search: 100
iterative_scan: relaxed_order
route_by_query_type: true
