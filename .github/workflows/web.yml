name: web

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", ".github/workflows/web.yml"]

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    env:
      # The build inlines these; the smoke test serves the mock API (and its Supabase login) here.
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8099
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:8099
      NEXT_PUBLIC_SUPABASE_ANON_KEY: mock-anon-key
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Types match the schema (fails on drift)
        run: npm run check:types
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4.6.2
        if: failure()
        with:
          name: playwright-traces
          path: web/test-results
          retention-days: 7
