[project]
name = "sre-evals"
version = "0.1.0"
description = "Golden-set tooling, retrieval metrics, eval runner and results reports."
requires-python = ">=3.12,<3.13"
dependencies = [
    "sre-shared",
    "sre-core",
    "typer>=0.12",
    "rich>=13.9",
    "deepeval>=3.0",
    "langsmith>=0.2",
    "openai>=1.50",
]

[project.scripts]
sre-eval = "sre_evals.cli:app"
sre-golden = "sre_evals.golden.cli:app"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
