# Lab pg_hba.conf for the primary/replica pair (profile `replica` in infra/compose.lab.yml).
# Same rules as the Supabase image plus `replication` lines. Lab credentials only; every
# port is bound to 127.0.0.1 on the host.
local all  supabase_admin     trust
local all  all                peer map=supabase_map
host  all  all  127.0.0.1/32  trust
host  all  all  ::1/128       trust
# The standby streams WAL as the `replicator` role over the compose network.
host  replication  replicator  10.0.0.0/8      scram-sha-256
host  replication  replicator  172.16.0.0/12   scram-sha-256
host  replication  replicator  192.168.0.0/16  scram-sha-256
host  all  all  10.0.0.0/8      scram-sha-256
host  all  all  172.16.0.0/12   scram-sha-256
host  all  all  192.168.0.0/16  scram-sha-256
