# Lab services that run beside the Supabase local stack (npx supabase start).
# Phase 1 needs only the shared test Postgres; Redis, the streaming replica, Toxiproxy,
# Prometheus and Grafana arrive in later phases. Ollama runs natively on Windows for the GPU.
# WARNING: never run `docker compose ... --profile replica down -v`: the profile shares this
# project with `testdb`, and `down -v` deletes testdb's volume too. Remove only the replica
# services and their volumes (infra/load/README.md has the exact commands).
name: sre-lab

services:
  testdb:
    # Same image the Supabase CLI runs, so integration tests match the lab database.
    image: ${SRE_TEST_PG_IMAGE:-public.ecr.aws/supabase/postgres:17.11.0.006}
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:54400:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # --- profile `agent` (Phase 3): Redis for the exact cache, budgets and the mcp-ops task
  # store in the lab (`--profile agent up -d redis`). Ephemeral: no persistence, 64 MB, LRU.
  # The demo uses Upstash for caches and budgets only, never for the task store.
  redis:
    profiles: ["agent"]
    image: ${SRE_REDIS_IMAGE:-redis:7.4-alpine}
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb",
              "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # --- profile `replica`: a primary and a streaming hot standby, for the read-routing and load
  # experiments. `docker compose -f infra/compose.lab.yml --profile replica up -d`, then
  # `uv run python infra/postgres/schema.py` builds the schema on the primary (the standby
  # replays it). Nothing here starts without the profile, so `testdb` is unaffected.
  pg-primary:
    profiles: ["replica"]
    image: ${SRE_TEST_PG_IMAGE:-public.ecr.aws/supabase/postgres:17.11.0.006}
    environment:
      POSTGRES_PASSWORD: postgres
      REPLICATION_PASSWORD: replicator
    command: &pg-command
      - postgres
      - -D
      - /etc/postgresql
      - -c
      - hba_file=/lab-pg/pg_hba.conf
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=5
      - -c
      - max_replication_slots=5
      - -c
      - hot_standby=on
      - -c
      - hot_standby_feedback=on
      - -c
      - wal_keep_size=256MB
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=100
    volumes:
      - ./postgres:/lab-pg:ro
      - ./postgres/primary-init.sh:/docker-entrypoint-initdb.d/zz-replication.sh:ro
      - pg-primary-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:54410:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 30

  pg-replica:
    profiles: ["replica"]
    image: ${SRE_TEST_PG_IMAGE:-public.ecr.aws/supabase/postgres:17.11.0.006}
    depends_on:
      pg-primary:
        condition: service_healthy
    environment:
      POSTGRES_PASSWORD: postgres
      REPLICATION_PASSWORD: replicator
      PRIMARY_HOST: pg-primary
    entrypoint: ["bash", "/lab-pg/replica-entrypoint.sh"]
    command: *pg-command
    volumes:
      - ./postgres:/lab-pg:ro
      - pg-replica-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:54411:5432"
    healthcheck:
      # Healthy once the standby accepts read-only connections and reports recovery.
      test: ["CMD-SHELL", "psql -U postgres -h 127.0.0.1 -tAc 'select pg_is_in_recovery()' | grep -q t"]
      interval: 5s
      timeout: 3s
      retries: 40

volumes:
  pg-primary-data:
  pg-replica-data:
